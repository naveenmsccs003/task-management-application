# Local development services (docs/deployment.md §1). Start with: docker compose up -d
# The API and Angular app run on the host (dotnet run / npm start), not in containers, during development.
name: tma-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: tma
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tma"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches all outgoing email; web UI on http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
