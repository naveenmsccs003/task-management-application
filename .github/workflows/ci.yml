name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NG_CLI_ANALYTICS: "false"

jobs:
  backend:
    name: Backend (build, format, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore TaskManagement.slnx

      - name: Check formatting and code style
        run: dotnet format TaskManagement.slnx --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build TaskManagement.slnx --configuration Release --no-restore

      - name: Check for model changes without a migration
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/TaskManagement.Infrastructure
          --startup-project src/TaskManagement.Infrastructure
          --configuration Release --no-build

      - name: Check for vulnerable packages
        run: |
          dotnet list TaskManagement.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      # Integration tests start PostgreSQL 18 with Testcontainers (Docker is available on GitHub-hosted runners).
      - name: Test
        run: dotnet test --solution TaskManagement.slnx --configuration Release --no-build

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npm run build
      - name: Audit dependencies (high and critical)
        run: npm audit --audit-level=high

  # Real browser against the real API, Angular dev server and PostgreSQL (docs/testing.md §3). Runs on main only.
  e2e:
    name: End-to-end (Playwright)
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: e2e-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TMA_E2E_DB: Host=localhost;Port=5432;Database=tma_e2e;Username=postgres;Password=e2e-only-password
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Build API
        run: dotnet build src/TaskManagement.Api

      - name: Install frontend and Playwright
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e
          cd e2e && npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
