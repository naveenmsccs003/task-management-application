version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "Npgsql*", "EFCore.*"]
      testing:
        patterns: ["xunit*", "Testcontainers*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "typescript"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
